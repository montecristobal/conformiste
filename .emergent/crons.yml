crons:
  - name: rappels-echeances
    description: "Génère chaque jour les rappels d'échéance J-30 et J-7 des dossiers de francisation"
    cron: "0 12 * * *"
    endpoint: "{{BASE_URL}}/api/v1/cron/reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: resume-hebdo
    description: "Envoie chaque lundi aux consultants PRO un résumé des échéances à venir de leur portefeuille"
    cron: "0 12 * * 1"
    endpoint: "{{BASE_URL}}/api/v1/cron/weekly-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
